[project]
name = "vyse"
version = "0.1.0"
description = "Local-first AI receptionist for your Windows PC (Ollama + Qwen3)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "rich>=13",
    "psutil>=5.9",
    "pyperclip>=1.8",
    "mcp>=1.0",
    "pycaw>=20240210",
]

[project.optional-dependencies]
google = [
    "google-api-python-client",
    "google-auth-oauthlib",
]
dev = ["pytest>=8"]

[project.scripts]
vyse = "vyse.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vyse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
